[project]
name = "research-swarm-backend"
version = "0.1.0"
description = "Autonomous Research Agent Swarm - backend"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-groq>=0.2",
    "langchain-core>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "tenacity>=8.2",
    "ddgs>=9",
    "httpx>=0.27",
    "trafilatura>=1.8",
    "pysbd>=0.3",
    "rank-bm25>=0.2",
    "numpy>=1.26",
    "rich>=13",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "aiosqlite>=0.20",
    "markdown>=3.6",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
